name: api_ease
description: Eliminate API call boilerplate in Flutter. Auto internet check, loading states, response validation, retry, debounce — in one line. Works with any HTTP client.
version: 1.0.0
homepage: https://github.com/HarshVerma007/api_ease-flutter_package
repository: https://github.com/HarshVerma007/api_ease-flutter_package
issue_tracker: https://github.com/HarshVerma007/api_ease-flutter_package/issues
topics:
  - api
  - networking
  - connectivity
  - retry
  - loading-state

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0
